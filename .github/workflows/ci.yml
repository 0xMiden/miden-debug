name: CI

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "**.txt"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"

env:
  # Set the new value when the cache grows too much and we hit the runner's disk space limit
  # via https://github.com/rust-lang/docs.rs/pull/2433
  RUST_CACHE_KEY: rust-cache-20251006

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - &install-cargo-make
        name: Install cargo-make
        run: |
          if ! cargo make --version 2>/dev/null; then
            cargo install cargo-make --force
          fi
      - name: Clippy
        run: |
          cargo make clippy

  feature_combinations:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ github.workflow }}-shared-feature-combinations
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - *install-cargo-make
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-hack@0.6.44
      - name: Check feature combinations
        run: |
          cargo make check-feature-combinations

  check_format:
    name: check formatting
    runs-on: ubuntu-latest
    # Run this job after the linter, so the cache is hot
    needs: [lint]
    # But run this check even if the lint check failed
    if: ${{ always() }}
    steps:
      - *checkout
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Use a common cache for the basic compilation/formatter/clippy checks
          shared-key: ${{ github.workflow }}-shared
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          # But do not save this cache, just use it
          save-if: false
      - *install-cargo-make
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check Formatting
        run: |
          cargo make check-format

  unit_tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # NOTE: We use a different cache for the tests, so they can be run in parallel, but we
          # also share the cache for the tests for efficiency
          shared-key: ${{ github.workflow }}-shared-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - *install-cargo-make
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9
      - name: Check
        # We run `cargo check` to verify that the workspace compiles correctly before attempting
        # to execute the tests. This produces easier to read output if a compilation error occurs
        run: |
          cargo make check --tests
      - name: Test
        run: |
          cargo make test

  lit_tests:
    name: lit/filecheck tests
    runs-on: ubuntu-latest
    # Run after the unit tests so we can reuse a warm cache
    needs: [unit_tests]
    steps:
      - *checkout
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Dedicated cache for the lit job
          shared-key: ${{ github.workflow }}-shared-lit-tests
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - *install-cargo-make
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install litcheck
        run: |
          if ! litcheck --help >/dev/null 2>&1; then
            cargo install litcheck --locked
          fi
      - name: Test
        # The lit harness compiles `.masm` fixtures into `.masp` packages, then
        # checks debugger output with FileCheck.
        run: |
          cargo make test-lit

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ github.workflow }}-shared-coverage
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - *install-cargo-make
      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Run Rust coverage
        run: cargo make coverage
      - name: Record pull request for coverage comment
        if: ${{ github.event_name == 'pull_request' && always() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: printf '%s\n' "$PR_NUMBER" "$PR_HEAD_SHA" "$PR_HEAD_REPO" > coverage-pr-context.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rust-coverage
          path: |
            rust-coverage.xml
            coverage-pr-context.txt
          if-no-files-found: warn

  coverage-comment:
    name: append coverage report to pull request
    needs: [coverage]
    if: ${{ github.event_name == 'pull_request' && needs.coverage.result == 'success' }}
    # A called workflow can only *downgrade* the calling job's token, so this
    # grant is the ceiling for every job in `coverage-comment.yml`.
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/coverage-comment.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      run_id: ${{ github.run_id }}

  check_release:
    name: release checks
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *install-rust
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # NOTE: We use a different cache for the these release checks
          shared-key: ${{ github.workflow }}-shared-release-checks
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - *install-cargo-make
      - name: Build all targets in release configuration
        run: |
          cargo make build --release --all-targets
