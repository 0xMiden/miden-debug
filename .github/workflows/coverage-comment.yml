name: Coverage comment

on:
  workflow_call:
    inputs:
      ref:
        description: The commit the coverage report was generated for
        required: true
        type: string
      run_id:
        description: The id of the workflow run that produced the coverage report
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-coverage
          path: ${{ runner.temp }}/coverage
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update pull request coverage comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_ARTIFACT: ${{ runner.temp }}/coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await require(process.env.GITHUB_WORKSPACE + '/.github/scripts/coverage-comment.js')({ github, context, core });
