[workspace]
members = [".", "crates/dap", "crates/engine"]
resolver = "2"

[workspace.package]
version = "0.8.0"
rust-version = "1.92"
authors = ["Miden contributors"]
repository = "https://github.com/0xMiden/miden-debug"
homepage = "https://github.com/0xMiden/miden-debug"
documentation = "https://github.com/0xMiden/miden-debug"
categories = ["development-tools"]
keywords = ["miden", "debugger"]
license = "MIT"
readme = "README.md"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "env", "help", "suggestions", "error-context"]}
dap = { package = "miden-debug-dap", version = "0.8.0", path = "crates/dap", features = ["client"] }
log = "0.4"
miden-debug-engine = { version = "0.8.0", path = "crates/engine", default-features = false }
miden-assembly = { version = "0.23", default-features = false }
miden-assembly-syntax = { version = "0.23", default-features = false }
miden-core = { version = "0.23", default-features = false }
miden-debug-types = { version = "0.23", default-features = false }
miden-mast-package = { version = "0.23", default-features = false }
miden-processor = { version = "0.23", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "serde_derive",
    "alloc",
    "rc",
] }
serde_json = "1"
thiserror = "2.0"

[package]
name = "miden-debug"
description = "An interactive debugger for Miden VM programs"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "miden-debug"
path = "src/main.rs"
test = false
bench = false
required-features = ["std"]

[[example]]
name = "compile-masm"
required-features = ["std"]

[[test]]
name = "println_smoke_test"
required-features = ["tui"]

[[test]]
name = "println_empty_string"
required-features = ["tui"]

[[test]]
name = "println_invalid_utf8"
required-features = ["tui"]

[[test]]
name = "println_oversized_length"
required-features = ["tui"]

[[test]]
name = "println_uninitialized_memory"
required-features = ["tui"]

[[test]]
name = "println_multiple_prints"
required-features = ["tui"]

[features]
default = ["tui", "dap"]
tui = ["std", "dep:crossterm", "dep:env_logger", "dep:ratatui", "dep:tui-input", "dep:signal-hook", "dep:syntect", "miden-debug-engine/tui"]
repl = ["std", "dep:env_logger", "dep:rustyline", "miden-debug-engine/tui"]
dap = ["miden-debug-engine/dap"]
std = ["clap/std", "clap/env", "compact_str/std", "miden-assembly-syntax/std", "miden-debug-engine/std"]
proptest = ["miden-debug-engine/proptest"]

[dependencies]
clap.workspace = true
crossterm = { version = "0.29.0", optional = true, features = ["event-stream"] }
compact_str = { version = "0.9", default-features = false }
miden-debug-engine.workspace = true
env_logger = { version = "0.11", optional = true }
log.workspace = true
miden-assembly.workspace = true
miden-assembly-syntax.workspace = true
miden-core.workspace = true
miden-debug-types.workspace = true
miden-mast-package.workspace = true
miden-processor.workspace = true
ratatui = { version = "0.30.0", optional = true }
signal-hook = { version = "0.4.4", optional = true }
syntect = { version = "5.2.0", optional = true, default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "yaml-load",
    "regex-onig",
] }
thiserror.workspace = true
tui-input = { version = "0.15", optional = true }
rustyline = { version = "18.0", optional = true }
tokio = { version = "1.39.2", features = ["rt", "time", "macros", "rt-multi-thread"] }
tokio-util = "0.7.11"
futures = "0.3.30"
