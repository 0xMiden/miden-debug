[package]
name = "miden-debug-engine"
description = "Core debugger engine for miden-debug"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
default = ["std"]
dap = ["dep:miden-debug-dap", "dep:socket2"]
std = ["clap/std", "clap/env", "miden-assembly-syntax/std"]
proptest = ["dep:proptest"]

[dependencies]
clap.workspace = true
glob = "0.3.1"
inventory.workspace = true
log.workspace = true
miden-assembly.workspace = true
miden-assembly-syntax.workspace = true
miden-core.workspace = true
miden-debug-dap = { workspace = true, optional = true, features = ["client"] }
miden-debug-types.workspace = true
miden-mast-package.workspace = true
miden-package-registry.workspace = true
miden-processor.workspace = true
miden-project.workspace = true
num-traits = "0.2"
proptest = { version = "1.4", optional = true }
rustc-demangle = { version = "0.1", features = ["std"] }
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6", optional = true }
smallvec = { version = "1.14", default-features = false, features = [
    "union",
    "const_generics",
    "const_new",
    "drain_filter",
] }
thiserror.workspace = true
toml = { version = "1.1.2", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
