name = "miden-debug"

# Only `*.test` files are test entry points. The `*.masm` programs they debug
# sit alongside them as fixtures and are not themselves discovered as tests.
patterns = ["*.test"]

working_dir = "."

[substitutions]
# `miden-debug` resolves via the directory passed to `litcheck lit run --path`
# (see the `test-lit` task in Makefile.toml). `miden-vm` is installed by that
# task and found on PATH; `filecheck` is provided by litcheck itself.
